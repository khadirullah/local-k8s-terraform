#cloud-config
# ──────────────────────────────────────────────
# Worker Node Cloud-Init - Fedora/RHEL
# Installs containerd + kubeadm, waits for master
# to be ready via HTTP, then auto-joins the cluster
# ──────────────────────────────────────────────

hostname: ${hostname}
fqdn: ${hostname}.k8s.local
manage_etc_hosts: true

users:
  - name: ${ssh_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
    groups: [wheel]

# Disable swap
swap:
  filename: ""

write_files:
  # Kernel modules for containerd
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

  # Sysctl params for Kubernetes networking
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

  # containerd config with systemd cgroup (version 3 for containerd 2.x)
  - path: /etc/containerd/config.toml
    content: |
      version = 3
      [plugins."io.containerd.cri.v1.images"]
        sandbox_image = "registry.k8s.io/pause:3.11"
      [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc]
        runtime_type = "io.containerd.runc.v2"
        [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
          SystemdCgroup = true

  # Kubernetes dnf repo
  - path: /etc/yum.repos.d/kubernetes.repo
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/v${k8s_version}/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/v${k8s_version}/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

  # Script to auto-join the cluster via HTTP
  # Fetches join command from master's HTTP server (no SSH needed)
  - path: /root/join-cluster.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      MASTER_IP="${master_ip}"
      JOIN_URL="http://$MASTER_IP:8000/join-command.sh"
      MAX_RETRIES=60
      RETRY_INTERVAL=10

      echo "[worker] Waiting for master node to serve join token at $JOIN_URL ..."

      for i in $(seq 1 $MAX_RETRIES); do
        # Try to fetch join command via HTTP
        JOIN_CMD=$(curl -sf "$JOIN_URL" 2>/dev/null || true)

        if [ -n "$JOIN_CMD" ]; then
          echo "[worker] Got join command from master!"
          echo "[worker] Joining cluster with: $JOIN_CMD"
          eval "$JOIN_CMD"
          echo "[worker] Successfully joined the cluster!"
          exit 0
        fi

        echo "[worker] Attempt $i/$MAX_RETRIES - Master not ready yet. Retrying in $${RETRY_INTERVAL}s..."
        sleep $RETRY_INTERVAL
      done

      echo "[worker] ERROR: Could not fetch join command after $MAX_RETRIES attempts."
      echo "[worker] Manual join: ssh into master and run 'kubeadm token create --print-join-command'"
      exit 1

runcmd:
  # Disable swap
  - swapoff -a
  - sed -i '/swap/d' /etc/fstab

  # Disable SELinux
  - setenforce 0 || true
  - sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config

  # Disable firewalld
  - systemctl disable --now firewalld || true

  # Load kernel modules
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # Install containerd
  - dnf install -y containerd curl
  - mkdir -p /etc/containerd
  - systemctl restart containerd
  - systemctl enable containerd

  # Install kubeadm, kubelet, kubectl
  - dnf install -y kubelet kubeadm kubectl --disableexcludes=kubernetes
  - systemctl enable kubelet

  # Auto-join the cluster (fetches join token from master via HTTP)
  - /root/join-cluster.sh

final_message: "K8s worker node ${hostname} (Fedora) has joined the cluster! Cloud-init took $UPTIME seconds."
